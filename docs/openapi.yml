openapi: 3.1.0
info:
  title: Timevoice API
  description: |
    The Timevoice API allows you to manage time entries, projects, clients, tags, and invoices.
    
    ## Authentication
    
    All API requests require OAuth 2.0 authentication. Include the access token in the Authorization header:
    
    ```
    Authorization: Bearer YOUR_ACCESS_TOKEN
    ```
  version: "1.0"
  contact:
    name: Timevoice Support
    url: https://timevoice.mahadk.com
servers:
  - url: /api/v1
    description: API v1

security:
  - oauth2: []

tags:
  - name: Me
    description: Current user information
  - name: Workspaces
    description: Workspace management
  - name: Time Entries
    description: Track time spent on tasks
  - name: Projects
    description: Organize work into projects
  - name: Clients
    description: Manage clients
  - name: Tags
    description: Categorize time entries with tags
  - name: Invoices
    description: Create and manage invoices

paths:
  /me:
    get:
      tags: [Me]
      summary: Get current user
      description: Returns information about the authenticated user
      operationId: getMe
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      description: Returns all workspaces the user has access to
      operationId: listWorkspaces
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      description: Returns a specific workspace
      operationId: getWorkspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "k5nR8m"
          description: Workspace ID (hashid)
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /{workspace_id}/time_entries:
    get:
      tags: [Time Entries]
      summary: List time entries
      description: Returns time entries for a workspace
      operationId: listTimeEntries
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Filter entries starting from this date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: Filter entries up to this date
        - name: running
          in: query
          schema:
            type: boolean
          description: When true, return only running entries (no `ended_at`), however long ago they started. When false, return only stopped entries.
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Time Entries]
      summary: Create time entry
      description: Creates a new time entry
      operationId: createTimeEntry
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "201":
          description: Time entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /{workspace_id}/time_entries/start:
    post:
      tags: [Time Entries]
      summary: Start timer
      description: Starts a new running time entry
      operationId: startTimeEntry
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                project_id:
                  type: string
                billable:
                  type: boolean
                tag_ids:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Timer started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /{workspace_id}/time_entries/{id}:
    get:
      tags: [Time Entries]
      summary: Get time entry
      operationId: getTimeEntry
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Time entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Time Entries]
      summary: Update time entry
      operationId: updateTimeEntry
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "200":
          description: Time entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Time Entries]
      summary: Delete time entry
      operationId: deleteTimeEntry
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Time entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /{workspace_id}/time_entries/{id}/stop:
    patch:
      tags: [Time Entries]
      summary: Stop timer
      description: Stops a running time entry
      operationId: stopTimeEntry
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Timer stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /{workspace_id}/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /{workspace_id}/clients:
    get:
      tags: [Clients]
      summary: List clients
      operationId: listClients
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Clients]
      summary: Create client
      operationId: createClient
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /{workspace_id}/tags:
    get:
      tags: [Tags]
      summary: List tags
      operationId: listTags
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tags]
      summary: Create tag
      operationId: createTag
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /{workspace_id}/invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      description: Lists the workspace's invoices, newest first
      operationId: listInvoices
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Invoices]
      summary: Create invoice
      description: Creates a draft invoice from your unbilled time entries for the client's projects in the period. Requires the `invoices` scope.
      operationId: createInvoice
      security:
        - oauth2: [invoices]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceWithLines"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /{workspace_id}/invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice
      operationId: getInvoice
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Invoice details with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceWithLines"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Invoices]
      summary: Update invoice status
      description: Issues a draft, marks a draft or issued invoice paid, or moves a paid invoice back to issued (marks it unpaid). Issuing or paying a draft sets `issued_on` to today; marking unpaid keeps it. Issued and paid invoices can't go back to draft (422). Requires the `invoices` scope.
      operationId: updateInvoice
      security:
        - oauth2: [invoices]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceWithLines"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Invoices]
      summary: Delete invoice
      description: Deletes a draft invoice; its time entries become unbilled again. Issued and paid invoices can't be deleted, so their entries can't be billed twice. Requires the `invoices` scope.
      operationId: deleteInvoice
      security:
        - oauth2: [invoices]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Invoice deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            read: View account info
            write: Modify account settings
            time_entries: Manage time entries
            projects: Manage projects
            clients: Manage clients
            tags: Manage tags
            invoices: Manage invoices

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        example: "k5nR8m"
      description: Workspace ID (hashid, not numeric)
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "xYz123"
      description: Resource ID (hashid, not numeric)

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized
    Forbidden:
      description: The access token lacks the required scope (`insufficient_scope`, with `error_description`), or your workspace role can't perform this action (`forbidden`, with `message`)
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  error:
                    type: string
                    const: insufficient_scope
                  error_description:
                    type: string
                    example: "Required scope: invoices"
              - type: object
                properties:
                  error:
                    type: string
                    const: forbidden
                  message:
                    type: string
                    example: You are not authorized to perform this action
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not_found
    UnprocessableEntity:
      description: Invalid parameters or failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unprocessable_entity
              message:
                type: string
                example: client_id "abc123" does not exist in this workspace

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "abc123"
        name:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: string
          nullable: true

    Workspace:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "k5nR8m"
        name:
          type: string
        created_at:
          type: string
          format: date-time

    TimeEntry:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "xYz123"
        description:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        billable:
          type: boolean
        project:
          $ref: "#/components/schemas/Project"
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    TimeEntryInput:
      type: object
      properties:
        description:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        billable:
          type: boolean
        project_id:
          type: string
        tag_ids:
          type: array
          items:
            type: string
      required:
        - started_at

    Project:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "pR0j3c"
        name:
          type: string
        color:
          type: string
        billable_default:
          type: boolean
        client:
          $ref: "#/components/schemas/Client"
          nullable: true

    ProjectInput:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        billable_default:
          type: boolean
        client_id:
          type: string
      required:
        - name

    Client:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "cL13nt"
        name:
          type: string
        email:
          type: string
          nullable: true
        billing_address:
          type: [string, "null"]

    ClientInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        billing_address:
          type: [string, "null"]
      required:
        - name

    Tag:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "t4g123"
        name:
          type: string
        color:
          type: string
          nullable: true

    TagInput:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      required:
        - name

    Invoice:
      type: object
      properties:
        id:
          type: string
          description: Hashid
          example: "1nv01c"
        number:
          type: integer
          description: Invoice number, sequential within the workspace
          example: 42
        status:
          type: string
          enum: [draft, issued, paid]
        total_cents:
          type: integer
          example: 80750
        total_amount:
          type: string
          example: "$807.50"
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        issued_on:
          type: string
          format: date
        notes:
          type: [string, "null"]
          readOnly: true
          description: Markdown notes printed under the totals on the invoice PDF, such as payment terms or bank details. Copied from the workspace's billing settings when the invoice is created, so later changes to the settings don't affect it.
          example: "**Payment due within 30 days.**\n- Bank: Monzo"
        line_count:
          type: integer
        client:
          $ref: "#/components/schemas/Client"

    InvoiceWithLines:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            invoice_lines:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceLine"

    InvoiceLine:
      type: object
      properties:
        description:
          type: string
        qty_hours:
          type: [number, "null"]
          example: 1.5
        rate_cents:
          type: [integer, "null"]
          example: 9500
        amount_cents:
          type: integer
          example: 14250
        rate:
          type: [string, "null"]
          example: "$95.00"
        amount:
          type: string
          example: "$142.50"

    InvoiceInput:
      type: object
      properties:
        client_id:
          type: string
          description: Client hashid
        period_start:
          type: string
          format: date
          description: First day of the period whose unbilled time entries are invoiced
        period_end:
          type: string
          format: date
          description: Last day of the period (inclusive)
        rate_cents:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: Hourly rate in cents. Omit it or send null to use the workspace's billable rate.
      required:
        - client_id
        - period_start
        - period_end

    InvoiceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [issued, paid]
      required:
        - status
